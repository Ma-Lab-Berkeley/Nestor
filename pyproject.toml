[project]
name = "nestor"
version = "0.1.0"
description = "Nestor: a nested sparse transformer, with its dense and MoE baselines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jaxtyping>=0.3.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "tiktoken>=0.7.0",
    "torch>=2.8.0",
    "wandb>=0.21.3",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2", "ruff>=0.14.8"]

[project.scripts]
nestor_cli = "nestor.cli:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nestor*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F722", "F821"]  # jaxtyping string annotations

[tool.pytest.ini_options]
python_classes = ["*Test"]
