<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nestor: one block of C = 4 columns, the token's K_c = 2 active columns drawn as stacks of layers -->
  <rect width="64" height="64" rx="14" fill="#884EA0"/>
  <g fill="#fff">
    <!-- inactive columns -->
    <rect x="9"  y="14" width="7" height="36" rx="2.5" opacity=".28"/>
    <rect x="35" y="14" width="7" height="36" rx="2.5" opacity=".28"/>
    <!-- active columns: three layers each -->
    <rect x="22" y="14" width="7" height="10" rx="2"/>
    <rect x="22" y="27" width="7" height="10" rx="2"/>
    <rect x="22" y="40" width="7" height="10" rx="2"/>
    <rect x="48" y="14" width="7" height="10" rx="2"/>
    <rect x="48" y="27" width="7" height="10" rx="2"/>
    <rect x="48" y="40" width="7" height="10" rx="2"/>
  </g>
</svg>
