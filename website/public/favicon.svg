<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nestor mark: a geometric N whose right stem is a stack of three layers (nested blocks) -->
  <rect width="64" height="64" rx="14" fill="#884EA0"/>
  <g fill="#fff">
    <rect x="13" y="13" width="10" height="38" rx="2"/>
    <polygon points="13,13 25,13 51,51 39,51"/>
    <rect x="41" y="13" width="10" height="11" rx="2"/>
    <rect x="41" y="26.5" width="10" height="11" rx="2"/>
    <rect x="41" y="40" width="10" height="11" rx="2"/>
  </g>
</svg>
